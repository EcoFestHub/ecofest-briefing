<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
:root {
  --ground: #f2f5f3; --paper: #ffffff; --ink: #15211c; --muted: #5f6e68; --line: #d8e0dc;
  --accent: #1f6f63; --accent-soft: #e2f0ec; --warm: #a9601a; --warm-soft: #f8ecdd;
  --done: #2e7d4f; --done-soft: #e3f2e8; --quiet: #7d8580; --quiet-soft: #eceeed;
  --k-gt: #2f5d9e; --k-ga: #7a4fa3; --k-in: #1f6f63;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light; --s: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1613; --paper: #17201c; --ink: #e3ebe7; --muted: #9db0a8; --line: #2a3832;
    --accent: #5cc0ac; --accent-soft: #1b352f; --warm: #e2a057; --warm-soft: #3a2a18;
    --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e9893; --quiet-soft: #232b28;
    --k-gt: #7aa7e6; --k-ga: #b794e0; --k-in: #5cc0ac; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --ground: #0f1613; --paper: #17201c; --ink: #e3ebe7; --muted: #9db0a8; --line: #2a3832;
    --accent: #5cc0ac; --accent-soft: #1b352f; --warm: #e2a057; --warm-soft: #3a2a18;
    --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e9893; --quiet-soft: #232b28;
    --k-gt: #7aa7e6; --k-ga: #b794e0; --k-in: #5cc0ac; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: calc(16px * var(--s)); line-height: 1.55; padding: 28px 16px 64px; }
a { color: var(--accent); }
button, input, textarea, select { font-family: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font-size: calc(12px * var(--s)); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(30px, 6vw, 42px) * var(--s)); line-height: 1.08; margin: 6px 0 0; text-wrap: balance; }
h1 em { font-style: italic; color: var(--accent); }
h2 { font-family: var(--f-display); font-weight: 500; font-size: calc(24px * var(--s)); margin: 0 0 10px; text-wrap: balance; }
.small { font-size: calc(13px * var(--s)); color: var(--muted); }
.muted { color: var(--muted); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.error { background: var(--warm-soft); color: var(--warm); border-radius: 8px; padding: 12px 14px; font-size: calc(14px * var(--s)); }

.who-pick { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.names button { border: 1px solid var(--line); background: var(--ground); color: var(--ink); font-size: calc(15px * var(--s)); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.names button:hover { border-color: var(--accent); }
.switch { border: 0; background: none; color: var(--accent); font-size: calc(14px * var(--s)); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.nav { display: flex; gap: 8px; }
.nav button { flex: 1 1 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
.nav button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }

.gist { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.gist li { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.gist li:last-child { border-bottom: 0; padding-bottom: 0; }
.gist .k { font-weight: 700; font-size: calc(14px * var(--s)); color: var(--accent); padding-top: 2px; }
.gist .v { min-width: 0; }
@media (max-width: 480px) { .gist li { grid-template-columns: 1fr; } }

.part { display: grid; gap: 14px; }
.part-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.part-head h2 { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: calc(13px * var(--s)); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.k-grouptask { --kc: var(--k-gt); }
.k-groupask { --kc: var(--k-ga); }
.k-individual { --kc: var(--k-in); }
.dot { background: var(--kc); }
.ask { display: grid; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-left: 8px solid var(--kc); border-radius: 10px; padding: 16px 16px 16px 14px; }
.kind { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--kc); }
.ask-text { font-size: calc(17px * var(--s)); font-weight: 500; }
.ask-meta { font-size: calc(14px * var(--s)); color: var(--muted); }
.ask-meta a { font-weight: 600; }
.resp { display: flex; flex-wrap: wrap; gap: 8px; }
.resp button { border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: calc(14px * var(--s)); font-weight: 600; padding: 8px 13px; border-radius: 6px; cursor: pointer; }
.resp button:hover { border-color: var(--muted); }
.resp button:disabled { opacity: .5; cursor: wait; }
.answered { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: calc(14px * var(--s)); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--s)); font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.done { background: var(--done-soft); color: var(--done); }
.chip.team { background: var(--accent-soft); color: var(--accent); }
.chip.cant { background: var(--warm-soft); color: var(--warm); }
.chip.open { background: var(--quiet-soft); color: var(--quiet); }
.chip.query { background: var(--warm-soft); color: var(--warm); }
.resp button.ghosty { border-style: dashed; color: var(--muted); font-weight: 500; }
.note { font-size: calc(14px * var(--s)); color: var(--muted); margin: 0; }
.stack { display: grid; gap: 10px; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline input { flex: 1 1 200px; min-width: 0; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.optional { font-size: calc(13px * var(--s)); color: var(--muted); font-style: italic; font-weight: 400; }
.none { color: var(--muted); }
.extras { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 8px; }
.extras details summary { cursor: pointer; font-size: calc(13px * var(--s)); font-weight: 600; color: var(--muted); }
.who-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.who-list .chip { font-weight: 500; }
.suggest { background: var(--ground); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.pickchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pickchips label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: calc(14px * var(--s)); cursor: pointer; }
.pickchips input { margin: 0; }
.suggest textarea { width: 100%; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }

details.talk { border-top: 1px solid var(--line); padding-block: 12px; }
details.talk:last-of-type { border-bottom: 1px solid var(--line); }
details.talk summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.talk summary::-webkit-details-marker { display: none; }
details.talk summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details.talk[open] summary::after { content: "–"; }
details.talk p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }

.bar-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; align-items: center; font-size: calc(14px * var(--s)); }
.track { height: 8px; background: var(--quiet-soft); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; }
.btn { display: inline-block; background: var(--accent); color: var(--paper); font-weight: 700; text-decoration: none; padding: 12px 18px; border-radius: 6px; border: 0; cursor: pointer; font-size: calc(15px * var(--s)); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn:disabled { opacity: .6; cursor: wait; }

/* add page */
.addrow { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab, legend { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field textarea, .field input[type="date"], .field select { width: 100%; font-size: calc(15px * var(--s)); padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.toggle button { border: 0; background: var(--ground); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 9px 18px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.plus { border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-size: calc(15px * var(--s)); font-weight: 700; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.radio { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.radio label { display: inline-flex; align-items: center; gap: 8px; font-size: calc(15px * var(--s)); }

/* PM */
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { flex: 1 1 130px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.stat b { display: block; font-size: calc(26px * var(--s)); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: calc(13px * var(--s)); color: var(--muted); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.q { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q label { font-size: calc(12px * var(--s)); font-weight: 600; color: var(--muted); }
.q textarea, .q input, .q select { width: 100%; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.q .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
@media (max-width: 520px) { .q .row2 { grid-template-columns: 1fr; } }
.check { font-size: calc(13px * var(--s)); color: var(--warm); background: var(--warm-soft); border-radius: 6px; padding: 6px 10px; }
.table-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: calc(14px * var(--s)); }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: calc(12px * var(--s)); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td .chips { display: flex; flex-wrap: wrap; gap: 4px; }
pre.copy { margin: 0; white-space: pre-wrap; font-family: var(--f-body); font-size: calc(14px * var(--s)); background: var(--ground); border-radius: 6px; padding: 12px; }
.owners { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.owner { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--ink); font-size: calc(14px * var(--s)); padding: 3px 3px 3px 10px; border-radius: 999px; }
.owner button { border: 0; background: none; color: var(--muted); font-size: calc(16px * var(--s)); line-height: 1; cursor: pointer; padding: 3px 7px; border-radius: 999px; }
.owners select { width: auto; font-size: calc(14px * var(--s)); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: calc(14px * var(--s)); max-width: calc(100% - 32px); z-index: 10; }

.tools { display: flex; justify-content: flex-end; gap: 6px; }
.tools button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; min-width: 44px; min-height: 40px; padding: 4px 12px; border-radius: 8px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
.tools button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div class="wrap" style="margin-bottom:20px"><div class="tools" id="tools" role="group" aria-label="Display settings"></div></div>
<main class="wrap" id="app"><p class="loading">Loading…</p></main>

<script>
const EF = { mode: "brief", view: "add", root: "../" };
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIDlqlaE10Q-1e2aPVry1TUUIXBoTUya1EbZ18Tr_pP7Eicz2zky0MdOXgs476TRi6Rg/exec";
const ROOT = new URL(EF.root, location.href).href;
const MODE = EF.mode;
const ORG = 'EcoFest 2027 team';
const PFX = 'ecofest';
let PM_KEY = '';
if (MODE === 'pm') {
  const q = new URLSearchParams(location.search).get('pm') || '';
  try { if (q) localStorage.setItem(PFX + 'PmKey', q); PM_KEY = q || localStorage.getItem(PFX + 'PmKey') || ''; } catch (e) { PM_KEY = q; }
}
let VIEW = EF.view;   // 'my' (My asks) or 'add' (Add asks)
// All fixed wording comes from the Wording tab in the Briefings sheet (the server sends it with every response).
let WORDS = {};
function t(key, v) { return String(WORDS[key] == null ? '' : WORDS[key]).replace(/[{]([a-z_]+)[}]/g, (m, k) => (v && v[k] != null ? v[k] : m)); }
const app = document.getElementById('app');
let data = null;
let busy = false;
let teamFor = null;
let suggestFor = null;
let suggestPick = [];
let suggestNote = '';
let addRows = [];
let addWhen = 'meeting';
let addWhenSet = false;
let addReview = false;

function el(tag, props, kids) {
  const n = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  });
  [].concat(kids || []).forEach(c => { if (c !== null && c !== undefined && c !== '') n.append(c); });
  return n;
}
function chip(s) { return el('span', { class: 'chip ' + s, text: t('status_' + s) || s }); }
function fail(err) { busy = false; app.prepend(el('div', { class: 'error', role: 'alert', text: (err && err.message) || String(err) })); }
function call(fn, args, ok, onFail) {
  busy = true;
  fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(r => r.json())
    .then(res => {
      busy = false;
      if (!res || res.ok !== true) throw new Error((res && res.error) || 'Something went wrong. Please reload the page.');
      const r = res.result;
      if (r && r.words) WORDS = r.words;
      if (r == null) { (onFail || fail)(new Error('Something went wrong. Please reload the page.')); return; }
      ok(r);
    })
    .catch(e => { busy = false; if (onFail) onFail(e); else fail(e); });
}
function toast(msg) {
  const t = el('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
/** Owner chips with a remove button, plus a dropdown to add a person or organisation. onChange gets the list each time. */
function ownerPicker(id, initial, names, onChange) {
  let current = String(initial || '').split(',').map(s => s.trim()).filter(Boolean);
  const box = el('div', { class: 'owners' });
  const sel = el('select', { id: 'add-' + id, 'aria-label': 'Add a person or organisation' },
    [el('option', { value: '', text: 'Add a person or organisation…' })].concat(names.map(n => el('option', { value: n, text: n }))));
  sel.addEventListener('change', () => { if (sel.value && current.indexOf(sel.value) < 0) current.push(sel.value); sel.value = ''; draw(); });
  function draw() {
    box.replaceChildren(...current.map(n => el('span', { class: 'owner' }, [n,
      el('button', { type: 'button', 'aria-label': 'Remove ' + n, text: '×', onclick: () => { current = current.filter(x => x !== n); draw(); } })])), sel);
    if (onChange) onChange(current.slice());
  }
  draw();
  return { el: box, value: () => current.join(', '), list: () => current.slice() };
}
// Who's viewing: kept in memory, in the page address (?p=Name, so a bookmark remembers it) and in local storage where the browser allows it.
let ME = '';
function getMe() { if (ME) return ME; try { return localStorage.getItem(PFX + 'Person') || ''; } catch (e) { return ''; } }
function setMe(v) {
  ME = v;
  try { v ? localStorage.setItem(PFX + 'Person', v) : localStorage.removeItem(PFX + 'Person'); } catch (e) {}
  try { const u = new URL(location.href); if (v) u.searchParams.set('p', v); else u.searchParams.delete('p'); history.replaceState(null, '', u); } catch (e) {}
}

/* ------------------------------------------------ display settings (day/night, text size) */
const SIZES = [0.9, 1, 1.15, 1.3, 1.5, 1.75];
const prefs = { theme: "", size: 1 };
try { prefs.theme = localStorage.getItem(PFX + "Theme") || ""; prefs.size = parseFloat(localStorage.getItem(PFX + "Size")) || 1; } catch (e) {}
function isDark() { return prefs.theme ? prefs.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
function applyPrefs() {
  const root = document.documentElement;
  if (prefs.theme) root.setAttribute("data-theme", prefs.theme); else root.removeAttribute("data-theme");
  root.style.colorScheme = isDark() ? "dark" : "light";
  root.style.setProperty("--s", prefs.size);
  try { localStorage.setItem(PFX + "Theme", prefs.theme); localStorage.setItem(PFX + "Size", prefs.size); } catch (e) {}
  drawTools();
}
function stepSize(d) {
  let i = SIZES.findIndex(s => Math.abs(s - prefs.size) < 0.01); if (i < 0) i = 1;
  prefs.size = SIZES[Math.max(0, Math.min(SIZES.length - 1, i + d))]; applyPrefs();
}
function drawTools() {
  const i = SIZES.findIndex(s => Math.abs(s - prefs.size) < 0.01);
  document.getElementById("tools").replaceChildren(
    el("button", { type: "button", text: "A−", "aria-label": "Smaller text", title: "Smaller text", disabled: i === 0, onclick: () => stepSize(-1) }),
    el("button", { type: "button", text: "A+", "aria-label": "Larger text", title: "Larger text", disabled: i === SIZES.length - 1, onclick: () => stepSize(1) }),
    el("button", { type: "button", text: isDark() ? "☀ Day" : "☾ Night", "aria-label": isDark() ? "Switch to day mode" : "Switch to night mode", onclick: () => { prefs.theme = isDark() ? "light" : "dark"; applyPrefs(); } })
  );
}
applyPrefs();

/* ------------------------------------------------ member pages */

function loadBriefing() { call('getBriefing', [getMe()], d => { data = d; renderMember(); }); }
function renderMember() { if (VIEW === 'add' && getMe()) renderAdd(); else renderBriefing(); }

function namePicker() {
  return [
    el('header', {}, [el('div', { class: 'eyebrow', text: t('eyebrow') }), el('h1', {}, [t('who_a') + ' ', el('em', { text: t('who_b') })])]),
    el('section', { class: 'who-pick' }, [
      el('p', { class: 'muted', style: 'margin:0', text: t('who_hint') }),
      el('div', { class: 'names' }, data.people.map(p => el('button', { type: 'button', text: p.display, onclick: () => { setMe(p.name); loadBriefing(); } }))),
    ]),
  ];
}
function navBar() {
  return el('nav', { class: 'nav', 'aria-label': 'Pages' }, [
    el('button', { type: 'button', text: t('nav_asks'), 'aria-current': VIEW === 'my' ? 'page' : false, onclick: () => { VIEW = 'my'; renderMember(); } }),
    el('button', { type: 'button', text: t('nav_add'), 'aria-current': VIEW === 'add' ? 'page' : false, onclick: () => { VIEW = 'add'; renderMember(); } }),
  ]);
}

function renderBriefing() {
  const me = data.people.find(p => p.name === getMe());
  const b = data.briefing;
  if (!me) { app.replaceChildren(...namePicker()); return; }
  const kids = [navBar()];
  kids.push(el('header', {}, [
    el('div', { class: 'eyebrow', text: b ? t('eyebrow_meeting', { meeting: b.meeting }) : t('eyebrow') }),
    el('h1', {}, [t('greet_a', { name: me.display }) + ' ', el('em', { text: t('greet_b') })]),
    el('p', { class: 'small', style: 'margin:8px 0 0' }, [t('not_you', { name: me.display }) + ' ', el('button', { class: 'switch', type: 'button', text: t('switch'), onclick: () => { setMe(''); renderMember(); } })]),
  ]));
  if (b && b.landed.length) {
    kids.push(el('section', {}, [el('h2', { text: t('h_landed') }), el('ul', { class: 'gist' }, b.landed.map(r => el('li', {}, [el('span', { class: 'k', text: r[0] }), el('span', { class: 'v', text: r[1] })])))]));
  }
  kids.push(renderPart(me));
  if (b && b.dates.length) {
    kids.push(el('section', {}, [el('h2', { text: t('h_coming') }), el('ul', { class: 'gist' }, b.dates.map(r => el('li', {}, [el('span', { class: 'k', text: r[0] }), el('span', { class: 'v', text: r[1] })])))]));
  }
  if (b && b.more.length) {
    kids.push(el('section', {}, [el('h2', { text: t('h_more') })].concat(b.more.map(r => el('details', { class: 'talk' }, [
      el('summary', { text: r[0] }),
      el('p', {}, [r[1] + ' ', r[2] ? el('a', { href: r[2], target: '_blank', rel: 'noopener', text: t('read_notes') }) : '']),
    ])))));
  }
  if (data.progress.length) {
    kids.push(el('section', {}, [el('h2', { text: t('h_tracking') })].concat(data.progress.map(p => el('div', { class: 'bar-row' }, [
      el('span', { text: p.group }),
      el('div', { class: 'track', role: 'img', 'aria-label': t('under_way', { moving: p.moving, total: p.total }) }, [el('div', { class: 'fill', style: 'width:' + Math.round(100 * p.moving / p.total) + '%' })]),
      el('span', { class: 'small', text: t('under_way', { moving: p.moving, total: p.total }) }),
    ])))));
  }
  kids.push(el('section', { class: 'inline' }, [
    data.dashboardUrl ? el('a', { class: 'btn ghost', href: data.dashboardUrl, target: '_blank', rel: 'noopener', text: t('btn_dashboard') }) : '',
    b && b.minutes ? el('a', { class: 'btn ghost', href: b.minutes, target: '_blank', rel: 'noopener', text: t('btn_minutes') }) : '',
  ]));
  app.replaceChildren(...kids);
}

function renderPart(me) {
  const mine = data.mine;
  const head = el('div', { class: 'part-head' }, [el('h2', { text: t('h_part') })]);
  if (!mine.length) return el('section', { class: 'part' }, [head, el('p', { class: 'none', style: 'margin:0', text: t('none_for_you') })]);
  const legend = el('div', { class: 'legend' }, [
    el('span', { class: 'k-grouptask' }, [el('i', { class: 'dot' }), t('kind_grouptask')]),
    el('span', { class: 'k-individual' }, [el('i', { class: 'dot' }), t('kind_individual')]),
    el('span', { class: 'k-groupask' }, [el('i', { class: 'dot' }), t('kind_groupask')]),
  ]);
  return el('section', { class: 'part' }, [head, legend].concat(mine.map(a => {
    const meta = el('div', { class: 'ask-meta' }, [
      a.groupAsk ? t('group_ask', { scope: a.scope }) : '',
      a.groupAsk && a.by ? ' · ' : '', a.by ? t('by', { by: a.by }) : '',
      a.addedBy ? ((a.groupAsk || a.by) ? ' · ' : '') + t('added_by', { who: a.addedBy }) : '',
      a.link ? ' · ' : '', a.link ? el('a', { href: a.link, target: '_blank', rel: 'noopener', text: t('open_link', { link: a.linkText || t('link_word') }) }) : '',
    ]);
    let tail;
    const buttons = withQuery => el('div', { class: 'resp' }, [
      el('button', { type: 'button', text: t('btn_done'), onclick: e => send(a.id, 'done', '', e.currentTarget) }),
      el('button', { type: 'button', text: t('btn_team'), onclick: () => { teamFor = a.id; renderMember(); } }),
      el('button', { type: 'button', text: t('btn_cant'), onclick: e => send(a.id, 'cant', '', e.currentTarget) }),
      withQuery ? el('button', { type: 'button', class: 'ghosty', text: t('btn_query'), title: t('query_tip'), onclick: e => send(a.id, 'query', '', e.currentTarget) }) : '',
    ]);
    if (a.answer && a.answer.status === 'query' && teamFor !== a.id) {
      // Stays in the list until a PM has checked it; they can still answer once it's clear.
      tail = el('div', { class: 'stack' }, [
        el('div', { class: 'answered' }, [chip('query'), el('span', { class: 'small', text: t('query_note') })]),
        buttons(false),
      ]);
    } else if (a.answer && a.answer.status !== 'open' && a.answer.status !== 'query') {
      const by = a.answer.by === me.name ? '' : t('answered_by', { name: (data.people.find(p => p.name === a.answer.by) || { display: a.answer.by }).display });
      tail = el('div', { class: 'answered' }, [
        chip(a.answer.status),
        el('span', { class: 'small', text: [by, a.answer.note].filter(Boolean).join(': ') }),
        el('button', { class: 'switch', type: 'button', text: t('change'), onclick: () => send(a.id, 'open', '') }),
      ]);
    } else if (teamFor === a.id) {
      const inp = el('input', { id: 'team-' + a.id, placeholder: t('team_placeholder'), 'aria-label': t('team_placeholder') });
      tail = el('form', { class: 'inline', onsubmit: e => { e.preventDefault(); teamFor = null; send(a.id, 'team', inp.value ? t('handed_to', { who: inp.value }) : ''); } }, [
        inp, el('button', { class: 'switch', type: 'submit', text: t('save') }),
      ]);
      setTimeout(() => inp.focus(), 0);
    } else {
      const pmNote = a.answer && a.answer.status === 'open' && a.answer.note ? el('p', { class: 'note', text: a.answer.note }) : '';
      tail = a.closed ? el('p', { class: 'note', text: t('closed_note') }) : el('div', { class: 'stack' }, [pmNote, buttons(!pmNote)]);
    }
    const shown = x => (String(x).trim() === '-' ? '' : String(x).trim());
    const hint = a.mode === 'invite' && !a.closed ? [shown(t('hint_invite')), a.joined ? shown(t('hint_invite_count', { joined: a.joined, total: a.total })) : ''].filter(Boolean).join(' ') : '';
    return el('div', { class: 'ask k-' + a.kind }, [
      el('div', { class: 'kind', text: t('kind_' + a.kind) }),
      el('div', { class: 'ask-text' }, [a.text, a.optional ? el('span', { class: 'optional', text: '  ' + t('if_someone') }) : '']),
      meta, tail,
      hint ? el('p', { class: 'note', style: 'font-size:calc(13px * var(--s))', text: hint }) : '',
      extras(a),
    ]);
  })));
}

/** Under each card: who else was asked (and who has answered), and "suggest adding someone". */
function extras(a) {
  const kids = [];
  if (a.others && a.others.length > 1) {
    kids.push(el('details', {}, [
      el('summary', { text: t('who_else') + ' (' + a.others.length + ')' }),
      el('div', { class: 'who-list' }, a.others.map(o => el('span', { class: 'chip ' + o.state, title: t('status_' + o.state) }, [o.name + (o.me ? ' (' + t('who_else_you') + ')' : '') + ' · ' + t('status_' + o.state)]))),
    ]));
  }
  if (a.suggested) {
    kids.push(el('span', { class: 'small', text: t('suggest_pending') }));
  } else if (suggestFor !== a.id) {
    kids.push(el('button', { class: 'switch', type: 'button', text: t('suggest_btn'), onclick: () => { suggestFor = a.id; suggestPick = []; suggestNote = ''; renderMember(); } }));
  }
  const box = [];
  if (suggestFor === a.id && !a.suggested) {
    const already = {};
    (a.others || []).forEach(o => { already[o.key] = true; });
    already[getMe()] = true;
    const people = data.people.filter(p => !already[p.name]);
    const note = el('textarea', { rows: 2, placeholder: t('suggest_note'), 'aria-label': t('suggest_note') });
    note.value = suggestNote;
    note.addEventListener('input', () => { suggestNote = note.value; });
    const send = el('button', { class: 'btn', type: 'button', text: t('suggest_send'), onclick: e => {
      if (busy) return;
      e.currentTarget.disabled = true; e.currentTarget.textContent = t('saving');
      call('suggestExtend', [a.id, getMe(), suggestPick, suggestNote], d => { data = d; suggestFor = null; renderMember(); toast(t('toast_suggest')); },
        err => { renderMember(); fail(err); });
    } });
    box.push(el('div', { class: 'suggest' }, [
      el('strong', { text: t('suggest_h') }),
      el('div', { class: 'pickchips' }, people.map(p => {
        const cb = el('input', { type: 'checkbox', value: p.name });
        cb.checked = suggestPick.indexOf(p.name) >= 0;
        cb.addEventListener('change', () => { suggestPick = cb.checked ? suggestPick.concat(p.name) : suggestPick.filter(x => x !== p.name); });
        return el('label', {}, [cb, p.display]);
      })),
      note,
      el('div', { class: 'inline' }, [send, el('button', { class: 'switch', type: 'button', text: 'Cancel', onclick: () => { suggestFor = null; renderMember(); } })]),
    ]));
  }
  return kids.length || box.length ? el('div', { class: 'stack' }, [kids.length ? el('div', { class: 'extras' }, kids) : '', ...box]) : '';
}

function send(id, status, note, btn) {
  if (busy) return;
  app.querySelectorAll('.resp button').forEach(b => { b.disabled = true; });
  if (btn) btn.textContent = t('saving');
  call('answer', [id, getMe(), status, note], d => { data = d; renderMember(); toast(status === 'open' ? t('toast_cleared') : status === 'query' ? t('toast_query') : t('toast_saved')); },
    e => { renderMember(); fail(e); });
}

      el('div', { class: 'grid2' }, [

        el('div', { class: 'field' }, [el('label', { for: 'ws-' + i, text: t('add_ws') }), ws]),
      ]),

      addRows.length > 1 ? el('button', { class: 'switch', type: 'button', style: 'justify-self:start', text: 'Remove this one', onclick: () => { addRows.splice(i, 1); renderAdd(); } }) : '',
    ]));

  rv.addEventListener('change', () => { addReview = rv.checked; });

    if (busy) return;

/* ------------------------------------------------ project-manager view */

function loadPm() { call('getPm', [PM_KEY], d => { data = d; renderPm(); }); }

/** One editable ask card for the PM view. okLabel/okToast differ between "held back" and "already live". */
function pmEditCard(x, d, okLabel, okToast, dropLabel) {
  const owners = ownerPicker(x.id, x.forText, d.names);
  const fBy = el('input', { id: 'by-' + x.id, value: x.by, placeholder: 'e.g. 20 Oct' });
  const fMode = el('select', { id: 'mode-' + x.id }, ['', 'Any one', 'Everyone', 'Invite'].map(v => el('option', { value: v, text: v || 'Automatic' })));
  fMode.value = x.mode;
  const fWs = el('select', { id: 'ws-' + x.id }, [el('option', { value: '', text: 'Not placed yet' })].concat((d.workstreams || []).map(w => el('option', { value: w, text: w }))));
  fWs.value = (d.workstreams || []).indexOf(x.section) >= 0 ? x.section : '';
  const fTarget = el('input', { id: 'tg-' + x.id, type: 'number', min: '1', value: x.target, placeholder: 'Enough at', 'aria-label': 'Enough at' });
  const fGreat = el('input', { id: 'gr-' + x.id, type: 'number', min: '1', value: x.great, placeholder: 'Great at', 'aria-label': 'Great at' });
  const invite = el('div', { class: 'inline', style: 'margin-top:6px' }, [fTarget, fGreat]);
  const showInvite = () => { invite.style.display = fMode.value === 'Invite' ? '' : 'none'; };
  fMode.addEventListener('change', showInvite); showInvite();
  const fAsk = el('textarea', { id: 'ask-' + x.id, rows: 2 });
  fAsk.value = x.ask;
  const ok = el('button', { class: 'btn', type: 'button', text: okLabel });
  const drop = el('button', { class: 'switch', type: 'button', text: dropLabel });
  const lock = label => { if (busy) return false; ok.disabled = true; drop.disabled = true; (label === 'ok' ? ok : drop).textContent = 'Saving…'; return true; };
  const unlock = e => { ok.disabled = false; drop.disabled = false; ok.textContent = okLabel; drop.textContent = dropLabel; fail(e); };
  ok.addEventListener('click', () => { if (lock('ok')) call('pmConfirm', [PM_KEY, x.id, owners.value(), fBy.value, fAsk.value, fMode.value, fTarget.value, fGreat.value, fWs.value], r => { data = r; renderPm(); toast(okToast); }, unlock); });
  drop.addEventListener('click', () => { if (lock('drop')) call('pmDiscard', [PM_KEY, x.id], r => { data = r; renderPm(); toast('Removed.'); }, unlock); });
  return el('div', { class: 'q' }, [
    el('div', { class: 'small', text: x.source }),
    x.check ? el('div', { class: 'check', text: x.check }) : '',
    x.needsWs && !x.check ? el('div', { class: 'check', text: 'Needs a workstream before it can land on the dashboard.' }) : '',
    el('label', { for: 'ask-' + x.id, text: 'Ask' }), fAsk,
    el('div', { class: 'row2' }, [
      el('div', {}, [el('label', { for: 'add-' + x.id, text: 'For' }), owners.el]),
      el('div', {}, [el('label', { for: 'by-' + x.id, text: 'By' }), fBy]),
    ]),
    el('div', { class: 'row2' }, [
      el('div', {}, [el('label', { for: 'ws-' + x.id, text: 'Workstream' }), fWs]),
      el('div', {}, [el('label', { for: 'mode-' + x.id, text: 'How many need to act?' }), fMode, invite]),
    ]),
    el('div', { class: 'inline' }, [ok, drop]),
  ]);
}

function renderPm() {
  const d = data;
  const kids = [el('header', {}, [el('div', { class: 'eyebrow', text: ORG + ' · project-manager view' + (d.me ? ' · ' + d.me : '') }), el('h1', {}, ['Where things ', el('em', { text: 'stand' })])])];
  kids.push(el('div', { class: 'stats' }, [['Done', d.stats.done], ['In progress', d.stats.team], [t('pm_cant_stat'), d.stats.cant], ['With you to check', d.stats.query], ['No answer yet', d.stats.open]]
    .map(([l, n]) => el('div', { class: 'stat' }, [el('b', { text: String(n) }), el('span', { text: l })]))));

  if (d.queries.length) {
    const qc = el('section', { class: 'card' }, [el('h2', { text: '“Not for me?” to check (' + d.queries.length + ')' })]);
    d.queries.forEach(x => {
      const off = el('button', { class: 'btn', type: 'button', text: 'Take ' + x.scope + ' off this' });
      const keep = el('button', { class: 'switch', type: 'button', text: 'It is theirs (I’ll explain)' });
      const lock = b => { if (busy) return false; off.disabled = true; keep.disabled = true; b.textContent = 'Saving…'; return true; };
      const unlock = e => { off.disabled = false; keep.disabled = false; off.textContent = 'Take ' + x.scope + ' off this'; keep.textContent = 'It is theirs (I’ll explain)'; fail(e); };
      off.addEventListener('click', () => { if (lock(off)) call('pmRemoveOwner', [PM_KEY, x.id, x.scope], r => { data = r; renderPm(); toast('Removed from their list.'); }, unlock); });
      keep.addEventListener('click', () => { if (lock(keep)) call('pmKeep', [PM_KEY, x.id, x.scope, ''], r => { data = r; renderPm(); toast('Back on their list with a note.'); }, unlock); });
      qc.append(el('div', { class: 'q' }, [
        el('div', { class: 'small', text: x.source + ' · asked by ' + x.by + (x.by !== x.scope ? ' for ' + x.scope : '') }),
        el('div', { text: x.ask }),
        el('div', { class: 'inline' }, [off, keep]),
      ]));
    });
    kids.push(qc);
  }

  if (d.suggestions.length) {
    const sc = el('section', { class: 'card' }, [el('h2', { text: 'Suggestions to extend an ask (' + d.suggestions.length + ')' })]);
    d.suggestions.forEach(x => {
      const add = el('button', { class: 'btn', type: 'button', text: x.add ? 'Add ' + x.add : 'Add them', disabled: !x.add });
      const no = el('button', { class: 'switch', type: 'button', text: 'Decline' });
      const act = (b, action, msg) => { if (busy) return; add.disabled = true; no.disabled = true; b.textContent = 'Saving…';
        call('pmSuggestion', [PM_KEY, x.row, action], r => { data = r; renderPm(); toast(msg); }, e => { renderPm(); fail(e); }); };
      add.addEventListener('click', () => act(add, 'add', 'Added to the ask.'));
      no.addEventListener('click', () => act(no, 'decline', 'Declined.'));
      sc.append(el('div', { class: 'q' }, [
        el('div', { class: 'small', text: x.by + ' suggests extending this ask (currently for ' + (x.forText || '—') + ')' }),
        el('div', { text: x.ask }),
        x.add ? el('div', { text: 'Add: ' + x.add }) : '',
        x.note ? el('div', { class: 'small', text: '“' + x.note + '”' }) : '',
        el('div', { class: 'inline' }, [add, no]),
      ]));
    });
    kids.push(sc);
  }

  const held = el('section', { class: 'card' }, [el('h2', { text: 'Held back for you to confirm' + (d.queue.length ? ' (' + d.queue.length + ')' : '') })]);
  if (!d.queue.length) held.append(el('p', { class: 'none', style: 'margin:0', text: 'Nothing waiting. Asks appear here when the person adding them ticks “ask a PM to confirm”.' }));
  d.queue.forEach(x => held.append(pmEditCard(x, d, 'Looks right, publish it', 'Published and added to the dashboard.', 'Remove it')));
  kids.push(held);

  const live = el('section', { class: 'card' }, [el('h2', { text: 'Added and already live: have a look' + (d.live.length ? ' (' + d.live.length + ')' : '') }),
    el('p', { class: 'small', style: 'margin:0', text: 'These are already in people’s briefings and on the dashboard. Edit or remove anything that needs it; “Looks right” just marks it as seen.' })]);
  if (!d.live.length) live.append(el('p', { class: 'none', style: 'margin:0', text: 'Nothing new to review.' }));
  d.live.forEach(x => live.append(pmEditCard(x, d, 'Looks right', 'Marked as reviewed.', 'Remove it')));
  kids.push(live);

  const bl = el('section', { class: 'card' }, [el('h2', { text: 'Backlog: still open from earlier meetings' + (d.backlog.length ? ' (' + d.backlog.length + ')' : '') }),
    el('p', { class: 'small', style: 'margin:0', text: d.hasBacklogRow ? 'These stay where they were raised and are listed in the BACKLOG row for ' + (d.nextMeeting || 'the next meeting') + '. “Put on the next agenda” adds a copy to that meeting’s agenda, marked as a nudge.' : 'Add a row labelled “BACKLOG (still open)” at the bottom of the Tracking tab and these will be listed there for the next meeting.' })]);
  if (!d.backlog.length) bl.append(el('p', { class: 'none', style: 'margin:0', text: 'Nothing is hanging over from earlier meetings.' }));
  d.backlog.forEach(x => {
    const b = el('button', { class: 'btn', type: 'button', text: x.onAgenda ? 'On the agenda (nudge ' + x.nudges + ')' : 'Put on the next agenda', disabled: x.onAgenda });
    b.addEventListener('click', () => { if (busy) return; b.disabled = true; b.textContent = t('saving'); call('pmPromote', [PM_KEY, x.id], r => { data = r; renderPm(); toast('Added to the next agenda as a nudge.'); }, e => { renderPm(); fail(e); }); });
    bl.append(el('div', { class: 'q' }, [
      el('div', { class: 'small', text: 'Raised ' + x.raised + ' · ' + x.forText + (x.summary ? ' · ' + x.summary : '') }),
      el('div', { text: x.text }),
      el('div', { class: 'inline' }, [b]),
    ]));

  kids.push(bl);

  if (d.cants.length) {
    const cc = el('section', { class: 'card' }, [el('h2', { text: t('pm_cants_h') + ' (' + d.cants.length + ')' }),

    d.cants.forEach(x => {
      const again = el('button', { class: 'btn', type: 'button', text: t('pm_again') });
      const drop = el('button', { class: 'switch', type: 'button', text: 'Let it go' });
      const lock = b => { if (busy) return false; again.disabled = true; drop.disabled = true; b.textContent = t('saving'); return true; };
      const unlock = e => { again.disabled = false; drop.disabled = false; again.textContent = t('pm_again'); drop.textContent = 'Let it go'; fail(e); };
      again.addEventListener('click', () => { if (lock(again)) call('pmCarry', [PM_KEY, x.id, x.scope], r => { data = r; renderPm(); toast(t('pm_again_toast')); }, unlock); });
      drop.addEventListener('click', () => { if (lock(drop)) call('pmRemoveOwner', [PM_KEY, x.id, x.scope], r => { data = r; renderPm(); toast('Let go. Taken off their list.'); }, unlock); });
      cc.append(el('div', { class: 'q' }, [
        el('div', { class: 'small', text: x.source + ' · ' + x.scope + (x.by && x.by !== x.scope ? ' (answered by ' + x.by + ')' : '') }),
        el('div', { text: x.ask }),
        el('div', { class: 'inline' }, [again, drop]),
      ]));
    });
    kids.push(cc);
  }

  kids.push(el('section', {}, [el('h2', { text: 'All current asks' }), el('div', { class: 'table-wrap' }, [el('table', {}, [
    el('thead', {}, [el('tr', {}, [el('th', { text: 'Ask' }), el('th', { text: 'By' }), el('th', { text: 'Answers' })])]),
    el('tbody', {}, d.list.map(a => el('tr', {}, [
      el('td', {}, [a.text, el('div', { class: 'small', text: a.source })]),
      el('td', { class: 'small', text: a.by }),
      el('td', {}, [
        a.summary ? el('div', { class: 'small', style: 'font-weight:600;margin-bottom:4px', text: a.summary }) : '',
        (() => {
          const chips = el('div', { class: 'chips' }, a.states.length ? a.states.map(s => el('span', { title: s.note || '' }, [chip(s.status), ' ', el('span', { class: 'small', text: s.scope })])) : [el('span', { class: 'small', text: 'No one assigned' })]);
          return a.states.length > 4 ? el('details', {}, [el('summary', { class: 'small', style: 'cursor:pointer', text: 'Who’s who (' + a.states.length + ')' }), chips]) : chips;
        })(),
        a.mode === 'invite' && !a.level ? el('button', { class: 'switch', type: 'button', style: 'margin:6px 12px 0 0', text: a.nudge ? 'Take off nudges' : 'Add to nudges', onclick: () => { if (busy) return; call('pmNudge', [PM_KEY, a.id, !a.nudge], r => { data = r; renderPm(); toast(a.nudge ? 'Taken off the nudge list.' : 'Added to the nudge list.'); }); } }) : '',
        a.mode === 'invite' ? el('button', { class: 'switch', type: 'button', style: 'margin-top:6px', text: a.enough ? 'Reopen' : 'That’s enough', onclick: () => { if (busy) return; call('pmEnough', [PM_KEY, a.id, !a.enough], r => { data = r; renderPm(); toast(a.enough ? 'Reopened.' : 'Marked as enough.'); }); } }) : '',
      ]),
    ]))),
  ])])]));

  const nudge = el('section', { class: 'card' }, [el('h2', { text: 'Friendly nudges' }), el('p', { class: 'small', style: 'margin:0', text: 'Asks due within two days with no answer, plus any invite asks you add with “Add to nudges”. Each goes only to people who haven’t answered. Copy one into your own email or chat if you want to send it.' })]);
  if (!d.nudges.length) nudge.append(el('p', { class: 'none', style: 'margin:0', text: 'No nudges needed right now.' }));
  d.nudges.forEach(n => {
    nudge.append(el('pre', { class: 'copy', text: t(n.kind === 'invite' ? 'nudge_invite_text' : 'nudge_text', { to: n.to, ask: n.ask, by: n.by, when: n.when || '' }) }));
    if (!d.emailOn || !n.id) return;
    // Two taps on purpose: the first one asks, the second one sends.
    const b = el('button', { class: 'btn ghost', type: 'button', text: 'Email this to ' + n.to });
    let armed = false;
    b.addEventListener('click', () => {
      if (busy) return;
      if (!armed) { armed = true; b.textContent = 'Tap again to send to ' + n.to; return; }
      b.disabled = true; b.textContent = t('saving');
      call('pmEmailNudge', [PM_KEY, n.id], r => { const n2 = r.sent; data = r; renderPm(); toast('Sent to ' + n2 + (n2 === 1 ? ' person.' : ' people.')); },
        e => { b.disabled = false; armed = false; b.textContent = 'Email this to ' + n.to; fail(e); });
    });
    nudge.append(b);
  });
  kids.push(nudge);

  kids.push(el('section', { class: 'card' }, [el('h2', { text: 'Opener for the next meeting' }), el('pre', { class: 'copy', text: d.opener })]));
  kids.push(el('section', { class: 'inline' }, [
    el('a', { class: 'btn ghost', href: ROOT, text: 'Member briefing' }),
    el('a', { class: 'btn ghost', href: ROOT + 'add/', text: 'Add asks page' }),
    d.dashboardUrl ? el('a', { class: 'btn ghost', href: d.dashboardUrl, target: '_blank', rel: 'noopener', text: 'Dashboard' }) : '',
  ]));
  app.replaceChildren(...kids);
}

// When embedded in your own website, tell the page how tall we are so the frame fits without scrollbars.
function postHeight() { try { window.top.postMessage({ briefingHeight: document.documentElement.scrollHeight }, '*'); } catch (e) {} }
try { new ResizeObserver(postHeight).observe(document.body); } catch (e) { setInterval(postHeight, 1000); }

if (MODE === 'pm') loadPm();
else { const q = new URLSearchParams(location.search); const p = q.get('p'); if (p) ME = p; loadBriefing(); }
</script>
</body>
</html>
